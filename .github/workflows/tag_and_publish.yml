name: Tag and Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix-workflow

permissions:
  contents: write # For creating tags
  packages: write # For publishing to GitHub Packages

jobs:
  tag:
    uses: AllenNeuralDynamics/.github/.github/workflows/release-bump-version-uv.yml@main
    with:
      working-directory: "python"
      default_branch: "fix-workflow"
    secrets:
      repo-token: ${{ secrets.GITHUB_TOKEN }}

  release:
    runs-on: ubuntu-latest
    needs: tag # Only release after successful tag
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Build wheel and sdist
        run: |
          cd python
          uv version ${{ needs.tag.outputs.new_version }}
          uv build
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.tag.outputs.new_version }}
          name: Release ${{ needs.tag.outputs.new_version }}
          files: python/dist/*
          body: |
            Automated release for version ${{ needs.tag.outputs.new_version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
