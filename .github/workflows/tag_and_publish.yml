name: Tag and Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  tag:
    uses: AllenNeuralDynamics/.github/.github/workflows/release-bump-version-uv.yml@main
    secrets:
      working-directory: "python"
      repo-token: ${{ secrets.GITHUB_TOKEN }}

  release:
    runs-on: ubuntu-latest
    needs: tag # Only release after successful tag
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.new_version }}
          name: Release ${{ needs.tag.outputs.new_version }}
          body: |
            Automated release for version ${{ needs.tag.outputs.new_version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
