name: Lint, Type Check, and Test

on:
  workflow_dispatch:
    inputs:
      main_directory:
        description: "Directory to run type check on"
        required: true
        default: "python/src"
      test_directory:
        description: "Directory to run the test on"
        required: true
        default: "tests"

jobs:
  # Lint check and Type check ran in parallel
  lint_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: astral-sh/setup-uv@v4
      - name: Lint with Ruff
        run: uvx run ruff check

  type_check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "2.7", "3.12" ]
    steps:
      - uses: actions/checkout@v3
      - uses: astral-sh/setup-uv@v4
      - name: Type check with mypy
        run: |
          uvx run mypy ${{ github.event.inputs.main_directory }} --strict

  test_check:
    needs: [ lint_check, type_check ]
    runs-on: [ ubuntu-latest, windows-latest ]
    strategy:
      matrix:
        python-version: [ "2.7", "3.12" ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Install UV - set python version to ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Unit test with PyTest
        run: uvx run pytest ${{ github.event.inputs.test_directory }}
