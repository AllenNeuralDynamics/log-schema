---
version: 1
disable_existing_loggers: false
formatters:
  default:
    "()": aind_log_utils.main.DefaultFormatter
    static_fields:
      scope: default 
  other:
    static_fields:
      scope: other
    "()": aind_log_utils.main.DefaultFormatter

handlers:
  console:
    class: logging.StreamHandler
    formatter: default
    level: INFO
    stream: ext://sys.stdout
  console_other:
    class: logging.StreamHandler
    formatter: other
    level: INFO
    stream: ext://sys.stdout

loggers:
  "":
    handlers:
      - console
      - console_other
    level: INFO
    propagate: true
