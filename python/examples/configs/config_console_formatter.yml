---
version: 1
disable_existing_loggers: false
formatters:
  default:
    "()": log_schema.ConsoleFormatter
    template: "%(asctime)s | %(level)-20s | %(message)s | %(static_field_1)s"
    static_fields:
      static_field_1: value1
      static_field_2: value2
      static_field_3: value3

handlers:
  console:
    class: logging.StreamHandler
    formatter: default
    level: INFO
    stream: ext://sys.stdout

loggers:
  "":
    handlers:
      - console
    level: INFO
    propagate: true
