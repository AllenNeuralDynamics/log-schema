---
version: 1
disable_existing_loggers: false
formatters:
  default:
    "()": log_schema.DefaultFormatter
handlers:
  console:
    class: logging.StreamHandler
    formatter: default
    level: INFO
    stream: ext://sys.stdout
  cloudwatch:
    class: watchtower.CloudWatchLogHandler
    formatter: default
    level: INFO
    log_group_name: log-schema
loggers:
  "":
    handlers:
      - console
      - cloudwatch
    level: INFO
    propagate: true
