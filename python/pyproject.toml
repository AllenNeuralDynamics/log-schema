[project]
name = "aind-log-utils"
version = "0.2.7"
description = "General purpose logging utility library"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

dependencies = [
    "pydantic>=2.5.3",
    "pydantic-settings>=2.0.3",
    "python-json-logger>=3.0.1",
    "pyyaml>=6.0.1",
    "types-pyyaml>=6.0.12.12",
]

[dependency-groups]
dev = [
  "interrogate>=1.5.0",
  "mypy>=1.4.1",
  "pytest>=7.4.4",
  "pytest-cov>=4.1.0",
  "python-dateutil>=2.9.0.post0",
  "ruff>=0.15.12",
  "types-python-dateutil>=2.8.19.14",
]
examples = [
    "watchtower>=3.1.0",
]

[build-system]
requires = ["uv-build>=0.1.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"] # Error, Pyflakes, Isort

[tool.coverage.run]
source = ["aind_log_utils"]
omit = ["*__init__*"]

[tool.coverage.report]
exclude_lines = ["if __name__ == .__main__.:", "pragma: no cover"]
fail_under = 100

[tool.interrogate]
exclude = ["docs", "build"]
fail-under = 100
