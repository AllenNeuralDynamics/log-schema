[project]
name = "aind-log-utils"
version = "0.2.7"
description = "Add logging to Code Ocean capsules"
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

dependencies = ["boto3", "watchtower"]

[dependency-groups]
dev = [
  "boto3-stubs[s3,watchtower]>=1.34.4",
  "interrogate>=1.5.0",
  "mypy>=1.4.1",
  "pytest>=7.4.4",
  "pytest-cov>=4.1.0",
  "ruff>=0.15.12",
]

[build-system]
requires = ["uv-build>=0.1.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"] # Error, Pyflakes, Isort

[tool.coverage.run]
source = ["aind_log_utils"]
omit = ["*__init__*"]

[tool.coverage.report]
exclude_lines = ["if __name__ == .__main__.:", "pragma: no cover"]
fail_under = 100

[tool.interrogate]
exclude = ["docs", "build"]
fail-under = 100
