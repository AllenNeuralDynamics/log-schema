disable_existing_loggers: true
formatters:
  detailed:
    datefmt: '%m/%d/%Y %I:%M:%S %p'
    format: '%(asctime)s, %(levelname)s, %(module)s::%(lineno)s, %(message)s'
  log_server:
    datefmt: '%Y-%m-%d %H:%M:%S'
    format: '%(asctime)s\n%(name)s\n%(levelname)s\n%(funcName)s (%(filename)s:%(lineno)d)\n%(message)s'
  simple:
    datefmt: '%m/%d/%Y %I:%M:%S %p'
    format: '%(asctime)s, %(message)s'
handlers:
  console_handler:
    class: logging.StreamHandler
    formatter: simple
    level: INFO
    stream: ext://sys.stdout
  default_file_handler:
    backupCount: 20
    class: logging.handlers.RotatingFileHandler
    encoding: utf8
    filename: c:/programdata/AIND/{project_name}/{project_name}.log
    formatter: simple
    level: INFO
    maxBytes: 10485760
  loki_handler:
    auth:
    - ''
    - ''
    class: logging_loki.LokiHandler
    formatter: log_server
    level: INFO
    tags:
      comp_id: ''
      log_session: ''
      project_name: ''
      user_name: ''
    url: https://logs-prod-021.grafana.net/loki/api/v1/push
    version: '1'
  watchtower:
    class: watchtower.CloudWatchLogHandler
    create_log_group: false
    level: INFO
    log_group_name: /aws/batch/job
    log_stream_name: '{logger_name}-{strftime:%y-%m-%d}'
    send_interval: 10
loggers:
  aind_logger:
    handlers:
    - console_handler
    level: INFO
    propagate: false
version: 1
