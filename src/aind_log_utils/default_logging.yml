# introduced with MPETK....
# disable_existing_loggers: true
formatters:
  codeocean:
    datefmt: '%Y-%m-%d %H:%M:%S'
    format: '%(asctime)s, %(process_name)s, %(comp_id)s, %(hostname)s, %(version)s, %(log_session)s, %(mouse_id)s, %(session_name)s, %(message)s'
handlers:
  codeoocean_handler:
    class: logging.StreamHandler
    formatter: codeocean
    level: INFO
    stream: ext://sys.stdout
root:
    handlers:
    - codeoocean_handler
    level: INFO
    propagate: True
version: 1
